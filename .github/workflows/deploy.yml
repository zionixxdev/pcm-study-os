name: Deploy to GitHub Pages

# The site is served from the `docs/` folder of `main` (Settings → Pages).
# This workflow rebuilds it and commits the result, so a source change on main
# goes live without any manual step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Skip the commit this workflow itself creates, so it cannot loop.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build for the project sub-path
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          cp dist/index.html dist/404.html
          rm -rf docs
          mkdir -p docs
          cp -r dist/. docs/
      - name: Commit the built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git commit -m "build: publish site to docs/ [skip ci]"
            git push
          fi
