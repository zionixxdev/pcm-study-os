name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b --pretty false
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      # Supabase config comes from the committed .env.production (public anon key only).
      - name: Production build
        run: npm run build
